<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hentai Stream</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: '#0B0C10',
            steel: '#1F2833',
            frost: '#C5C6C7',
            cyan: '#66FCF1',
            accent: '#45A29E'
          }
        }
      }
    }
  </script>
  <style>
    body { background: #0B0C10; color: #C5C6C7; }
    .card-hover:hover { transform: translateY(-4px); box-shadow: 0 10px 25px -5px rgba(102, 252, 241, 0.15); }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    #video-player { background: #000; }
  </style>
</head>
<body class="min-h-screen">
  <!-- Navbar -->
  <nav class="sticky top-0 z-50 bg-ink/95 backdrop-blur border-b border-steel">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center gap-4">
      <a href="#" onclick="showHome()" class="text-2xl font-bold text-cyan tracking-tight">Hentai<span class="text-white">Stream</span></a>
      
      <div class="flex-1 max-w-xl mx-4">
        <div class="relative">
          <input id="search-input" type="text" placeholder="Search titles..." 
            class="w-full bg-steel text-frost px-4 py-2 rounded-full border border-steel focus:border-cyan focus:outline-none text-sm"
            onkeydown="if(event.key==='Enter') doSearch()">
          <button onclick="doSearch()" class="absolute right-3 top-1/2 -translate-y-1/2 text-frost hover:text-cyan">
            🔍
          </button>
        </div>
      </div>

      <button onclick="showHome()" class="text-sm hover:text-cyan transition">Home</button>
    </div>
  </nav>

  <!-- Main Content -->
  <main id="app" class="max-w-7xl mx-auto px-4 py-6">
    <!-- Content will be injected here -->
  </main>

  <!-- Loading Overlay -->
  <div id="loading" class="fixed inset-0 bg-ink/80 flex items-center justify-center z-50 hidden">
    <div class="text-center">
      <div class="w-12 h-12 border-4 border-cyan border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
      <p class="text-frost">Loading...</p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
